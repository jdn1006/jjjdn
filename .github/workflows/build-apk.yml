name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # 兼容 main 和 master 分支
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 【新增】检查文件是否存在 (调试用)
    # 如果这一步报错说 gradlew 不存在，说明你的代码库里根本没这个文件
    - name: Check Files
      run: |
        echo "当前目录文件列表："
        ls -la
        echo "Gradle 目录检查："
        ls -la gradle/wrapper/ || echo "警告：未找到 gradle/wrapper 目录！"

    # 3. 设置 JDK 17 (移除了导致报错的 cache 参数)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. 授予权限并构建
    - name: Build with Gradle
      run: |
        # 强制赋予执行权限
        chmod +x ./gradlew
        # 执行构建 (如果是发布版请改为 assembleRelease)
        ./gradlew assembleDebug --stacktrace

    # 5. 上传产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        # 这里假设是 Debug 包，如果是 Release 请改为 release/app-release.apk
        path: app/build/outputs/apk/debug/app-debug.apk
