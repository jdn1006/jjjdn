name: Build APK

on:
  push:
    branches: [ "main" ] # 如果你的分支叫 master，请改为 "master"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 关键步骤：给 gradlew 权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 构建 Debug 包 (如果需要发布版，改为 ./gradlew assembleRelease)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 上传生成的 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
