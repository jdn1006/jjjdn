
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and build APK
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name package.json -print -quit)")"
          cd "$PROJECT_DIR"
          npm install
          npm run build
          npm run android:sync
                   cat >> android/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF 
          cd android
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Riftwake-Dingning-Era-APK
          path: dist-apk/app-debug.apk
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: dist-apk/*.apk
          if-no-files-found: error
