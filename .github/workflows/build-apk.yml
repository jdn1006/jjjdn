
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and build APK
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_JSON=$(find extracted -type f -name package.json \
            -not -path '*/node_modules/*' -print -quit)
          test -n "$PACKAGE_JSON"

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          cd "$PROJECT_DIR"

          npm install
          npm run build
          npm run android:sync

          if ! grep -q 'sourceCompatibility JavaVersion.VERSION_17' android/app/build.gradle; then
            cat >> android/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          fi

          cd android
          gradle --no-daemon assembleDebug

          APK_PATH=$(find . -type f -path '*/outputs/apk/*' -name '*.apk' -print -quit)
          test -n "$APK_PATH"

          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist-apk/app-debug.apk"

          echo "APK successfully generated:"
          ls -lh "$GITHUB_WORKSPACE/dist-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 7
